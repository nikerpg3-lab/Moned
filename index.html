<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanțe Personale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0f0f11;
      --surface:   #17171a;
      --border:    #2a2a30;
      --muted:     #52525e;
      --text:      #e8e8ed;
      --subtext:   #8e8e9e;
      --green:     #22c55e;
      --green-dim: #16a34a22;
      --red:       #f43f5e;
      --red-dim:   #f43f5e22;
      --accent:    #818cf8;
      --blue:      #38bdf8;   /* investiții */
      --blue-dim:  #38bdf818;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    /* Fundal cu grid subtil */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }

    .app-wrapper {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
    }

    /* Header */
    .app-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }
    .app-header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .app-header span {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Card de bază */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
    }

    /* Dashboard summary */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 700px) {
      .dashboard { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 400px) {
      .dashboard { grid-template-columns: 1fr; }
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: default;
    }
    .stat-card.clickable {
      cursor: pointer;
    }
    .stat-card.clickable:hover {
      border-color: var(--accent);
    }
    .stat-card.card-filter-active.filter-income {
      border-color: var(--green);
      box-shadow: 0 0 16px #00ff8830;
    }
    .stat-card.card-filter-active.filter-expense {
      border-color: var(--red);
      box-shadow: 0 0 16px #ff446630;
    }
    .stat-card.card-filter-active.filter-investment {
      border-color: var(--blue);
      box-shadow: 0 0 16px #38bdf830;
    }

    .stat-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .stat-value {
      font-family: 'DM Mono', monospace;
      font-size: 1.55rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      transition: color 0.3s;
    }
    .stat-value.income  { color: var(--green); }
    .stat-value.expense { color: var(--red); }
    .stat-value.balance.positive { color: var(--green); }
    .stat-value.balance.negative { color: var(--red); }
    .stat-value.balance.zero     { color: var(--subtext); }

    .stat-pill {
      display: inline-block;
      font-size: 0.65rem;
      font-family: 'DM Mono', monospace;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      width: fit-content;
    }
    .pill-green { background: var(--green-dim); color: var(--green); }
    .pill-red   { background: var(--red-dim);   color: var(--red); }
    .pill-blue  { background: var(--blue-dim);  color: var(--blue); }
    .pill-gray  { background: #ffffff10;         color: var(--muted); }

    /* Layout principal: formular + listă */
    .main-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1rem;
      align-items: start;
    }
    @media (max-width: 700px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* Formular */
    .form-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--subtext);
      margin-bottom: 1.25rem;
    }

    /* Toggle tip tranzacție */
    .type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 1.25rem;
      gap: 3px;
    }
    .type-btn {
      padding: 0.55rem;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      background: transparent;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .type-btn.active-income     { background: var(--green-dim); color: var(--green); }
    .type-btn.active-expense    { background: var(--red-dim);   color: var(--red); }
    .type-btn.active-investment { background: var(--blue-dim);  color: var(--blue); }

    /* Câmpuri formular */
    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .field input,
    .field select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      padding: 0.65rem 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
    }
    .field input:focus,
    .field select:focus { border-color: var(--accent); }
    .field select option { background: #1e1e24; }

    /* Mesaj eroare */
    #error-msg {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--red);
      margin-bottom: 0.75rem;
      min-height: 1rem;
    }

    /* Buton submit */
    .btn-add {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-add:hover  { opacity: 0.85; }
    .btn-add:active { transform: scale(0.98); }
    .btn-add.income-mode     { border: 2px solid var(--green); color: var(--green); box-shadow: 0 0 12px #00ff8833; }
    .btn-add.income-mode:hover     { background: var(--green-dim); }
    .btn-add.expense-mode    { border: 2px solid var(--red);   color: var(--red);   box-shadow: 0 0 12px #ff446633; }
    .btn-add.expense-mode:hover    { background: var(--red-dim); }
    .btn-add.investment-mode { border: 2px solid var(--blue);  color: var(--blue);  box-shadow: 0 0 12px #38bdf833; }
    .btn-add.investment-mode:hover { background: var(--blue-dim); }

    /* Lista tranzacții */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .list-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--subtext);
    }
    .list-count {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
    }

    /* Container lista */
    #transactions-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 460px;
      overflow-y: auto;
      padding-right: 4px;
    }
    #transactions-list::-webkit-scrollbar { width: 4px; }
    #transactions-list::-webkit-scrollbar-track { background: transparent; }
    #transactions-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Tranzacție individuală */
    .tx-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color 0.15s, opacity 0.3s;
      animation: slideIn 0.2s ease;
    }
    .tx-item:hover { border-color: var(--border); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tx-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-income     { background: var(--green); }
    .dot-expense    { background: var(--red); }
    .dot-investment { background: var(--blue); }

    .tx-info { flex: 1; min-width: 0; }
    .tx-cat {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-date {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .tx-amount {
      font-family: 'DM Mono', monospace;
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .tx-amount.income     { color: var(--green); }
    .tx-amount.expense    { color: var(--red); }
    .tx-amount.investment { color: var(--blue); }

    .tx-delete {
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      transition: color 0.15s, border-color 0.15s;
      font-family: 'DM Mono', monospace;
      flex-shrink: 0;
    }
    .tx-delete:hover { color: var(--red); border-color: var(--red-dim); }

    /* Stare goală */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
    .empty-state .empty-icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      opacity: 0.4;
    }
    .empty-state p {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">

    <!-- Header -->
    <header class="app-header">
      <h1>Finanțe Personale</h1>
      <span>tracker local</span>
    </header>

    <!-- Dashboard: 4 statistici -->
    <section class="dashboard" aria-label="Sumar financiar">
      <div class="stat-card clickable filter-income" id="card-income" onclick="setFilter('income')" title="Click pentru a filtra veniturile">
        <span class="stat-label">Venituri</span>
        <span class="stat-value income" id="total-income">0,00 lei</span>
        <span class="stat-pill pill-green" id="count-income">0 tranzacții</span>
      </div>
      <div class="stat-card clickable filter-expense" id="card-expense" onclick="setFilter('expense')" title="Click pentru a filtra cheltuielile">
        <span class="stat-label">Cheltuieli</span>
        <span class="stat-value expense" id="total-expense">0,00 lei</span>
        <span class="stat-pill pill-red" id="count-expense">0 tranzacții</span>
      </div>
      <div class="stat-card clickable filter-investment" id="card-investment" onclick="setFilter('investment')" title="Click pentru a filtra investițiile">
        <span class="stat-label">Investiții</span>
        <span class="stat-value" style="color: var(--blue)" id="total-investment">0,00 lei</span>
        <span class="stat-pill pill-blue" id="count-investment">0 transferuri</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Balanță</span>
        <span class="stat-value balance zero" id="balance">0,00 lei</span>
        <span class="stat-pill pill-gray" id="balance-label">neutru</span>
      </div>
    </section>

    <!-- Grid principal -->
    <div class="main-grid">

      <!-- Formular adăugare -->
      <div class="card" aria-label="Formular adăugare tranzacție">
        <p class="form-title">Tranzacție nouă</p>

        <!-- Toggle Venit / Cheltuială / Investiție -->
        <div class="type-toggle" role="group" aria-label="Tip tranzacție">
          <button class="type-btn active-income" id="btn-income"     onclick="setType('income')">+ Venit</button>
          <button class="type-btn"               id="btn-expense"    onclick="setType('expense')">− Chelt.</button>
          <button class="type-btn"               id="btn-investment" onclick="setType('investment')">↗ Inv.</button>
        </div>

        <!-- Sumă -->
        <div class="field">
          <label for="input-amount">Sumă (lei)</label>
          <input type="number" id="input-amount" placeholder="ex: 150" min="0.01" step="0.01" inputmode="decimal" />
        </div>

        <!-- Categorie -->
        <div class="field">
          <label for="input-category">Categorie</label>
          <select id="input-category"></select>
        </div>

        <!-- Dată -->
        <div class="field">
          <label for="input-date">Data</label>
          <input type="date" id="input-date" />
        </div>

        <!-- Mesaj eroare -->
        <p id="error-msg" role="alert" aria-live="polite"></p>

        <!-- Buton submit -->
        <button class="btn-add income-mode" id="btn-submit" onclick="addTransaction()">
          Adaugă Venit
        </button>
      </div>

      <!-- Lista tranzacții -->
      <div class="card" aria-label="Istoric tranzacții">
        <div class="list-header">
          <p class="list-title">Istoric</p>
          <span class="list-count">
            <span id="total-count">0 înregistrări</span>
            <span id="list-filter-label" style="font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--muted);margin-left:0.4rem;">Toate</span>
          </span>
        </div>
        <div id="transactions-list" aria-live="polite"></div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
